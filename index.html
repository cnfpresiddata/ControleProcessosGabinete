<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Controle de Processos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#00509b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f5f6f8; --sup:#ffffff; --tx:#16181d; --tx2:#5b616e; --tx3:#8a909c; --ln:#e3e6eb; --ln2:#d2d6dd;
  --esc:#16181d; --esc-tx:#fff;
  --verm:#c62828; --verm-bg:#fdecec; --lar:#e8590c; --lar-bg:#fff1e6; --amar:#b7791f; --amar-bg:#fdf6e3;
  --verde:#2e7d32; --verde-bg:#e9f5ea; --azul:#1f4e8c; --azul-bg:#e8eef7;
  --r:10px; --gap:10px; --pad:14px;
  --row-h:46px; --card-h:96px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:Geist,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{height:100dvh;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:var(--gap);
  padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right)) max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left))}
.app.foco{grid-template-rows:auto minmax(0,1fr)}
.app.foco .kpis,.app.foco .filtros{display:none}

/* topo */
.topo{display:flex;align-items:center;gap:10px;min-width:0}
.topo h1{font-size:17px;font-weight:650;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.topo .espaco{flex:1;min-width:0}
.topo h1 small{font-weight:450;color:var(--tx2);font-size:13px;margin-left:6px}
.vivo{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);white-space:nowrap}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
.vivo.on i{background:var(--verde)}
.bt{border:1px solid var(--ln2);background:var(--sup);border-radius:8px;padding:7px 12px;font-weight:500;white-space:nowrap;line-height:1.2}
.bt:hover{border-color:var(--tx3)}
.bt.esc{background:var(--esc);color:var(--esc-tx);border-color:var(--esc)}
.bt.esc:hover{background:#2b2f37}
.bt.on{background:var(--esc);color:#fff;border-color:var(--esc)}
.bt:disabled{opacity:.5;cursor:default}
.bt .ic{display:none}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap)}
.kpi-c{position:relative;min-width:0;display:flex}
.kpi-c>.kpi{flex:1;min-width:0;padding-right:32px}
.kpi-c>.ajuda-bt{position:absolute;top:7px;right:7px}
.kpi-c .kpi.k-venc.tem~.ajuda-bt{border-color:#fff;color:#fff;background:transparent}
.ajuda-bt{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--tx3);background:var(--sup);color:var(--tx2);font-weight:700;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.ajuda-bt:hover,.ajuda-bt:focus-visible{background:var(--esc);border-color:var(--esc);color:#fff;outline:none}
.h3aj{display:flex;align-items:center;gap:8px}
.bt-inicio{display:inline-flex;align-items:center;gap:6px;transition:background .3s,color .3s,border-color .3s,box-shadow .3s}
.bt-inicio svg{width:16px;height:16px;flex:none}
.bt-inicio.longe{background:var(--esc);color:#fff;border-color:var(--esc)}
.bt-inicio.anima{animation:chamar 1.4s ease-out 2}
@keyframes chamar{0%{box-shadow:0 0 0 0 rgba(22,24,29,.45)}70%{box-shadow:0 0 0 9px rgba(22,24,29,0)}100%{box-shadow:0 0 0 0 rgba(22,24,29,0)}}
@media (prefers-reduced-motion:reduce){.bt-inicio.anima{animation:none}}
.f-acoes{display:flex;gap:6px;align-items:center;min-width:0}
.aj-topo select{flex:1;min-width:0;font-weight:600}
.aj-intro{margin:0;font-size:14px;line-height:1.45;flex:none}
.aj-itens{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.aj-item{flex:none;border:1px solid var(--ln);border-radius:9px;padding:10px 12px;transition:background .6s,border-color .6s}
.aj-item.alvo{background:#f3f5f9;border-color:var(--tx3)}
.aj-item h4{margin:0 0 4px;font-size:14px;font-weight:650}
.aj-item p{margin:0;font-size:13.5px;line-height:1.45}
.aj-item .aj-ex{margin-top:6px;padding:6px 9px;border-left:3px solid var(--azul);background:var(--azul-bg);border-radius:0 6px 6px 0;font-size:13px}
.aj-item .aj-ex b{font-weight:650}
.aj-cor{display:inline-block;vertical-align:middle;margin:0 2px}
.login .aj-login{font-size:12.5px;color:var(--tx2);line-height:1.45;margin:0}
.login .link{all:unset;cursor:pointer;color:var(--azul);font-size:13px;text-decoration:underline}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--sup);border:1px solid var(--ln);border-radius:var(--r);
  padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:5px solid var(--ln2)}
.kpi:hover{border-color:var(--tx3)}
.kpi .curto{display:none}
.kpi.ativo{outline:2px solid var(--esc);outline-offset:-1px}
.kpi b{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.k-venc{border-left-color:var(--verm)} .kpi.k-venc.tem{background:var(--verm);border-color:var(--verm);color:#fff}
.kpi.k-venc.tem span{color:#fff}
.kpi.k-7{border-left-color:var(--lar)} .kpi.k-7.tem b{color:var(--lar)}
.kpi.k-crit{border-left-color:var(--verm)} .kpi.k-crit.tem b{color:var(--verm)}
.kpi.k-aguard{border-left-color:var(--azul)}
.kpi.k-sem{border-left-color:var(--tx3)}

/* filtros */
.filtros{display:grid;grid-template-columns:minmax(0,2fr) repeat(7,minmax(0,1fr)) auto;gap:8px;align-items:center}
.filtros input[type=search]{min-width:0;width:100%}
@media (min-width:860px) and (max-width:1439px){ .filtros{grid-template-columns:repeat(5,minmax(0,1fr))} .filtros input[type=search]{grid-column:span 2} }
.campo{border:1px solid var(--ln2);background:var(--sup);border-radius:8px;padding:7px 10px;min-width:0;height:36px}
select.campo{padding-right:6px;max-width:100%}
.filtros select.campo{width:100%}
.bt-filtros{display:none}
.conta-filtros{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--esc);color:#fff;font-size:11px;margin-left:4px;text-align:center}

/* área principal */
.principal{min-height:0;display:flex;flex-direction:column;background:var(--sup);border:1px solid var(--ln);border-radius:var(--r);overflow:hidden}
.corpo{flex:1;min-height:0;overflow:hidden;position:relative}
.pager{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--ln);font-size:13px;color:var(--tx2)}
.pager .bts{display:flex;gap:6px}
.pager .bt{padding:5px 12px}

/* tabela */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:12px;font-weight:600;color:var(--tx2);text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
th.ord{cursor:pointer} th.ord:hover{color:var(--tx)}
th .seta{font-size:10px;margin-left:3px}
td{height:var(--row-h);padding:0 10px;border-bottom:1px solid var(--ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#f8f9fb}
tr.venc td{background:var(--verm-bg)} tr.venc td:first-child{box-shadow:inset 5px 0 0 var(--verm)}
tr.urg td:first-child{box-shadow:inset 5px 0 0 var(--lar)}
td .sub{display:block;font-size:11.5px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis}
td.assunto{white-space:normal}
td.assunto div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.3}
.c-prazo{width:150px}.c-pri{width:92px}.c-sit{width:190px}.c-org{width:120px}.c-proc{width:170px}.c-uf{width:48px}.c-tipo{width:150px}

/* selos */
.selo{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;line-height:1.35}
.p-venc{background:var(--verm);color:#fff}
.p-urg{background:var(--lar);color:#fff}
.p-aten{background:var(--amar-bg);color:var(--amar);border:1px solid #ecd9a6}
.p-ok{background:#eef0f3;color:var(--tx)}
.p-sem{background:transparent;color:var(--tx3);border:1px dashed var(--ln2);font-weight:500}
.p-fim{background:transparent;color:var(--tx3);font-weight:500;border:1px solid var(--ln)}
.pr-Crítica{background:var(--verm);color:#fff}
.pr-Alta{background:var(--lar);color:#fff}
.pr-Normal{background:var(--verde);color:#fff}
.pr-sem{color:var(--tx3);font-weight:500;font-size:12px}
.sit{font-size:12.5px;color:var(--tx)}
.sit.vazio{color:var(--tx3)}

/* cartões (telas estreitas) */
.cards{display:flex;flex-direction:column;gap:8px;padding:8px}
.card{height:var(--card-h);flex:none;border:1px solid var(--ln);border-radius:9px;padding:8px 10px;display:grid;grid-template-rows:auto auto 1fr;gap:4px;cursor:pointer;overflow:hidden;background:var(--sup)}
.card.venc{border-color:var(--verm);border-left:6px solid var(--verm);background:var(--verm-bg)}
.card.urg{border-left:6px solid var(--lar)}
.card .l1{display:flex;gap:6px;align-items:center;min-width:0}
.card .l1 .proc{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.card .l2{display:flex;gap:6px;align-items:center;min-width:0;font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden}
.card .l2 .sit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .l3{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--tx)}

.vazio-lista{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--tx2);text-align:center;padding:20px}

/* vistas (detalhe, histórico, formulários) */
.vista{display:flex;flex-direction:column;height:100%;min-height:0}
.vista-topo{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ln);min-width:0}
.vista-topo h2{margin:0;font-size:15px;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vista-corpo{flex:1;min-height:0;overflow:hidden;padding:12px;display:flex;flex-direction:column;gap:10px}
.abas{flex:none;display:none;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--ln)}
.aba{all:unset;cursor:pointer;padding:7px 10px;font-weight:550;color:var(--tx2);border-bottom:2px solid transparent;font-size:13.5px}
.aba.on{color:var(--tx);border-bottom-color:var(--tx)}
.det-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
.painel{min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.painel h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx2);font-weight:600;flex:none}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;flex:none}
.dl div{min-width:0}
.dl dt{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.painel.dados.so-assunto .dl,.painel.dados.so-assunto h3{display:none}
.painel.dados.so-assunto .assunto-box{border-top:0;padding-top:0}
.dl dd{margin:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.assunto-box{flex:1;min-height:40px;overflow:hidden;border-top:1px solid var(--ln);padding-top:8px}
.assunto-box p{margin:0;line-height:1.4;font-size:14px}
.direita{display:grid;grid-template-rows:minmax(0,max-content) minmax(90px,1fr);gap:14px;min-height:0}
.form{display:flex;flex-direction:column;gap:8px;min-height:0}
.form .linhas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;flex:1 1 auto;min-height:0;overflow:hidden;align-content:start}
.vista-corpo>.form{flex:1}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--tx2);font-weight:500;min-width:0}
.form .larga{grid-column:1/-1}
.form .campo{width:100%;color:var(--tx);font-size:14px}
.form textarea.campo{height:auto;resize:none;min-height:38px}
.prio-sel{display:flex;gap:6px}
.prio-sel button{flex:1;border:1px solid var(--ln2);background:var(--sup);border-radius:8px;height:36px;font-weight:600;font-size:13px;min-width:0;padding:0 4px}
.prio-sel button.on.Crítica{background:var(--verm);border-color:var(--verm);color:#fff}
.prio-sel button.on.Alta{background:var(--lar);border-color:var(--lar);color:#fff}
.prio-sel button.on.Normal{background:var(--verde);border-color:var(--verde);color:#fff}
.prio-sel button.on.nenhuma{background:#eef0f3}
.acoes{display:flex;gap:8px;align-items:center;flex:none;flex-wrap:wrap;min-height:36px}
.acoes .msg{font-size:12.5px;color:var(--tx2);flex:1;min-width:120px}
.msg.erro{color:var(--verm)} .msg.ok{color:var(--verde)}
.paginas-form{font-size:12px;color:var(--tx3);white-space:nowrap}
.paginas-form .bt{padding:5px 10px}

.eventos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.prazo-linha{display:flex;gap:8px;align-items:center;min-width:0}
.prazo-linha input{flex:0 0 160px;width:160px}
.prazo-linha .regra-info{font-size:12px;color:var(--tx2);line-height:1.3;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.regra-info.alerta{color:var(--lar)}
#d-regra,#d-concl{-webkit-line-clamp:3}
.form .pz-info{margin:-2px 0 0;font-size:12px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--ln2);background:var(--sup);border-radius:8px;height:36px;font-weight:600;font-size:13px;padding:0 6px}
.seg button.on{background:var(--esc);border-color:var(--esc);color:#fff}
.check{flex-direction:row!important;align-items:center;gap:8px!important;font-size:13px!important;color:var(--tx)!important}
.check input{width:18px;height:18px}
.cobertura{font-size:12.5px;color:var(--tx2);flex:none;line-height:1.35}
.cobertura b{color:var(--tx)}
.cobertura .alerta{color:var(--lar);font-weight:600}
.itens{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.item{flex:none;height:54px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px;padding:0 2px;overflow:hidden}
.item.baixo{height:42px}
.item .txt{flex:1;min-width:0}
.item .t1{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n{font-size:12px;color:var(--tx2);white-space:nowrap}
.item .bt{padding:5px 9px;font-size:12.5px}
.bt.perigo{border-color:var(--verm);color:var(--verm)}
.painel-topo{display:flex;align-items:center;gap:8px;flex:none;min-height:32px}
.painel-topo h3{flex:1}
.painel-topo .bt{padding:5px 10px}
.pager.mini{height:38px;border-top:1px solid var(--ln);padding:4px 0}
.evento{flex:none;height:58px;padding:6px 2px;border-bottom:1px solid var(--ln);display:grid;grid-template-rows:auto 1fr;gap:2px;overflow:hidden}
.evento .q{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evento .q b{color:var(--tx2);font-weight:600}
.evento .d{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evento.clica{cursor:pointer} .evento.clica:hover{background:#f8f9fb}
.hist-filtros{display:flex;gap:8px;flex-wrap:wrap;flex:none}
.hist-filtros input{flex:1 1 200px}
.mais{font-size:12px;color:var(--tx3);flex:none}

/* login */
.login{height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px}
.login form{width:min(360px,100%);background:var(--sup);border:1px solid var(--ln);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font-size:19px;font-weight:650}
.login p{margin:0;color:var(--tx2);font-size:13px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--tx2)}
.login .campo{width:100%;height:40px;font-size:15px;color:var(--tx)}
.login .bt{height:42px;font-size:15px}

.carregando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:13px}

/* ---- responsivo ---- */
@media (max-width:1180px){ .c-tipo,.col-tipo{display:none} .c-sit{width:170px} }
@media (max-width:1000px){ .c-uf,.col-uf{display:none} .c-sit{width:150px} .c-proc{width:140px} .c-prazo{width:140px} }
@media (max-width:859px){
  :root{--pad:10px;--gap:8px}
  .kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
  .kpi-c{grid-column:span 2} .kpi-c:nth-child(n+4){grid-column:span 3}
  .topo h1 .nome-longo{display:none}
  .bt .tx-c{display:none}
  .kpi .longo{display:none} .kpi .curto{display:inline}
  .filtros{display:flex;flex-wrap:nowrap}
  .filtros input[type=search]{flex:1}
  .kpi{padding:7px 9px;border-left-width:4px}
  .kpi b{font-size:21px}
  .kpi span{font-size:11.5px}
  .filtros select.campo{display:none}
  .filtros .bt-limpar{display:none}
  .bt-filtros{display:inline-block}
  .abas{display:flex}
  .det-grid{display:block}
  .det-grid>.painel,.direita>*{display:none}
  .det-grid[data-aba=dados]>.painel.dados{display:flex;height:100%}
  .det-grid[data-aba=acomp]>.direita{display:grid;grid-template-rows:minmax(0,1fr);height:100%}
  .det-grid[data-aba=acomp]>.direita>.form{display:flex}
  .det-grid[data-aba=hist]>.direita{display:grid;grid-template-rows:minmax(0,1fr);height:100%}
  .det-grid[data-aba=hist]>.direita>.painel.hist{display:flex}
  .direita{gap:0}
  .topo h1 small{display:none}
  .bt .tx{display:none} .bt .ic{display:inline}
}
@media (max-width:520px){
  #f-novo .linhas,#fm-form .linhas{grid-template-columns:minmax(0,1fr)}
  .dl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .vivo .tx{display:none}
}
@media (max-width:420px){ .topo h1{display:none} .vivo{order:-1} }
@media (max-width:380px){
  .kpi b{font-size:18px}
  .kpi span{font-size:10.5px}
  .topo h1{font-size:15px}
  .bt{padding:6px 9px}
}
/* telas baixas (celular deitado) */
@media (max-height:520px){
  :root{--pad:8px;--gap:6px;--row-h:40px;--card-h:84px}
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr))}

    </form>

<script>
'use strict';
const SUPABASE_URL = 'https://rmjlqngrfgorhcwaarou.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtamxxbmdyZmdvcmhjd2Fhcm91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NTI4NjIsImV4cCI6MjEwMjEyODg2Mn0.sQazP8j9mxG7iXP66_2PXWZmE7sSCk0KXcu_SLs4H_c';
const DOMINIO = 'sispad.cnfpresiddata.local';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { db: { schema: 'sispad' }, auth: { persistSession: true, autoRefreshToken: true } });

const SITUACOES = ['Recebido pelo Gabinete','Encaminhado à unidade responsável','Aguardando assinatura do Ofício','Respondido','Arquivado'];
const FINAIS = ['Respondido','Arquivado'];
const PRIORIDADES = ['Crítica','Alta','Normal'];
const PRI_ORDEM = { 'Crítica':0, 'Alta':1, 'Normal':2 };
const UFS = 'AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO'.split(' ');
const COLS = 'id,processo_sei,processo_orgao,orgao_demandante,uf,localidade,assunto,situacao_ags,relator,tipo_procedimento,situacao,prioridade,data_recebimento,prazo_resposta,data_conclusao,observacao,atualizado_em';

const E = {
  dados: [], porId: new Map(), perfil: null, eventos: [],
  f: { busca:'', situacao:'', prioridade:'', prazo:'', orgao:'', uf:'', tipo:'', ags:'' },
  ord: { campo:'urgencia', dir:1 }, pagina: 0, porPagina: 10,
  vista: 'lista', selId: null, aba: 'dados', canal: null, vivo: false, sinc: null,
  hf: { busca:'', usuario:'', acao:'' }, hPagina: 0,
};

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sem = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function hojeISO(){ return new Intl.DateTimeFormat('en-CA', { timeZone:'America/Sao_Paulo' }).format(new Date()); }
function dias(iso){ if(!iso) return null; const a = Date.parse(iso+'T12:00:00Z'), b = Date.parse(hojeISO()+'T12:00:00Z'); return Math.round((a-b)/864e5); }
function difDias(a, b){ return Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5); }
const br = iso => iso ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : '';
const brHora = ts => new Date(ts).toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
const num = n => n.toLocaleString('pt-BR');
const ativo = r => !FINAIS.includes(r.situacao) && !r.data_conclusao;
const podeEditar = () => E.perfil && ['admin','editor'].includes(E.perfil.papel);
function rotulo(r){ return r.processo_orgao ? `${r.orgao_demandante} ${r.processo_orgao}` : (r.processo_sei ? `SEI ${r.processo_sei}` : `Processo ${r.id}`); }

function prazoInfo(r){
  if (!ativo(r)) return { cls:'p-fim', tx: r.data_conclusao ? `Concluído em ${br(r.data_conclusao)}` : r.situacao, nivel: 9 };
  const d = dias(r.prazo_resposta);
  if (d === null) return { cls:'p-sem', tx:'Sem prazo', nivel: 8 };
  if (d < 0) return { cls:'p-venc', tx:`Vencido há ${-d} dia${d === -1 ? '' : 's'}`, nivel: 0, d };
  if (d === 0) return { cls:'p-venc', tx:'Vence hoje', nivel: 0, d };
  if (d <= 3) return { cls:'p-urg', tx:`Vence em ${d} dia${d === 1 ? '' : 's'}`, nivel: 1, d };
  if (d <= 7) return { cls:'p-aten', tx:`Vence em ${d} dias`, nivel: 2, d };
  return { cls:'p-ok', tx:`${br(r.prazo_resposta)} (${d} dias)`, nivel: 3, d };
}
const seloPrazo = r => { const p = prazoInfo(r); return `<span class="selo ${p.cls}">${esc(p.tx)}</span>`; };
const seloPri = r => r.prioridade ? `<span class="selo pr-${r.prioridade}">${esc(r.prioridade)}</span>` : `<span class="pr-sem">Sem prioridade</span>`;
const txtSit = r => r.situacao ? `<span class="sit">${esc(r.situacao)}</span>` : `<span class="sit vazio">Sem situação</span>`;

/* ---------- dados ---------- */
async function carregar(){
  const todos = []; let de = 0;
  for(;;){
    const { data, error } = await sb.from('processos').select(COLS).order('id').range(de, de + 999);
    if (error) throw error;
    todos.push(...data); if (data.length < 1000) break; de += 1000;
  }
  E.dados = todos; E.porId = new Map(todos.map(r => [r.id, r])); E.sinc = new Date();
}
function addDias(iso, n){ const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
async function carregarEventos(){
  const { data, error } = await sb.from('historico').select('*').order('quando', { ascending:false }).limit(2000);
  if (!error) E.eventos = data;
}
function aplicarMudanca(p){
  if (p.eventType === 'DELETE'){ const id = p.old.id; E.porId.delete(id); E.dados = E.dados.filter(r => r.id !== id); }
  else {
    const n = {}; COLS.split(',').forEach(c => n[c] = p.new[c]);
    const v = E.porId.get(n.id);
    E.recentes = E.recentes || new Map(); E.recentes.set(n.id, Date.now());
    if (v) { Object.assign(v, n); delete v._b; } else { E.dados.push(n); E.porId.set(n.id, n); }
    if (E.vista === 'detalhe' && E.selId === n.id && !E.sujo) { render(); }
    else if (E.vista === 'detalhe' && E.selId === n.id && E.sujo) avisar('Outra pessoa acabou de alterar este processo. Salve de novo para conferir.', 'erro');
  }
  E.sinc = new Date();
  if (!['detalhe', 'novo', 'ajuda'].includes(E.vista)) render(); else renderTopo();
  if (E.modal) renderModal();
}
function assinar(){
  if (E.canal) sb.removeChannel(E.canal);
  E.canal = sb.channel('sispad-ao-vivo')
    .on('postgres_changes', { event:'*', schema:'sispad', table:'processos' }, aplicarMudanca)
    .on('postgres_changes', { event:'INSERT', schema:'sispad', table:'eventos' }, p => {
      const e = p.new; E.eventos.unshift({ id:e.id, quando:e.quando, usuario:e.usuario, acao:e.acao, registro:e.registro, descricao:e.descricao, registro_id:e.registro_id });
      if (E.vista === 'historico' || E.vista === 'detalhe') render();
    })
    .subscribe(st => { E.vivo = st === 'SUBSCRIBED'; renderTopo(); if (st === 'SUBSCRIBED') recarregarSilencioso(); });
}
let recTimer = null;
async function recarregarSilencioso(){
  clearTimeout(recTimer);
  recTimer = setTimeout(async () => { E.sincronizando = true; renderTopo(); try { await Promise.all([carregar(), carregarEventos()]); if (!E.sujo) render(); } catch(e){} E.sincronizando = false; renderTopo(); }, 300);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && E.perfil) recarregarSilencioso(); });
setInterval(() => { if (E.perfil && document.visibilityState === 'visible') recarregarSilencioso(); }, 5 * 60 * 1000);

/* ---------- filtros e ordenação ---------- */
function passa(r, f, ignorar){
  if (ignorar !== 'situacao' && f.situacao){
    if (f.situacao === '__sem'){ if (r.situacao) return false; }
    else if (f.situacao === '__ativos'){ if (!ativo(r)) return false; }
    else if (f.situacao === '__aguardando'){ if (!r.situacao || !ativo(r)) return false; }
    else if (r.situacao !== f.situacao) return false;
  }
  if (ignorar !== 'prioridade' && f.prioridade){ if (f.prioridade === '__sem' ? r.prioridade : r.prioridade !== f.prioridade) return false; }
  if (ignorar !== 'prazo' && f.prazo){
    const d = dias(r.prazo_resposta), at = ativo(r);
    if (f.prazo === 'vencido' && !(at && d !== null && d < 0)) return false;
    if (f.prazo === '7dias' && !(at && d !== null && d >= 0 && d <= 7)) return false;
    if (f.prazo === 'com' && !(at && d !== null)) return false;
    if (f.prazo === 'sem' && !(at && d === null)) return false;
  }
  if (f.orgao && r.orgao_demandante !== f.orgao) return false;
  if (f.uf && (f.uf === '__sem' ? r.uf : r.uf !== f.uf)) return false;
  if (f.tipo && (f.tipo === '__sem' ? r.tipo_procedimento : r.tipo_procedimento !== f.tipo)) return false;
  if (f.ags && (f.ags === '__sem' ? r.situacao_ags : r.situacao_ags !== f.ags)) return false;
  if (f.busca){
    const alvo = r._b || (r._b = sem([r.processo_sei, r.processo_orgao, r.orgao_demandante, r.assunto, r.relator, r.localidade, r.tipo_procedimento, r.observacao].join(' ')));
    for (const t of sem(f.busca).split(/\s+/).filter(Boolean)) if (!alvo.includes(t)) return false;
  }
  return true;
}
function filtrados(){
  const lista = E.dados.filter(r => passa(r, E.f));
  const { campo, dir } = E.ord;
  const urg = r => { const p = prazoInfo(r); return [p.nivel, p.d ?? 0, PRI_ORDEM[r.prioridade] ?? 3]; };
  const cmpArr = (a, b) => { for (let i = 0; i < a.length; i++){ if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return 0; };
  const chave = {
    urgencia: r => urg(r),
    prazo: r => [r.prazo_resposta ? 0 : 1, r.prazo_resposta || ''],
    prioridade: r => [PRI_ORDEM[r.prioridade] ?? 3],
    situacao: r => [r.situacao ? SITUACOES.indexOf(r.situacao) : 9],
    orgao: r => [sem(r.orgao_demandante)],
    processo: r => [sem(r.processo_orgao || r.processo_sei || '~')],
    uf: r => [r.uf || '~'],
    tipo: r => [sem(r.tipo_procedimento || '~')],
  }[campo];
  return lista.map(r => [chave(r), r]).sort((a, b) => cmpArr(a[0], b[0]) * dir || a[1].id - b[1].id).map(x => x[1]);
}
function nFiltros(){ return Object.entries(E.f).filter(([k, v]) => v && k !== 'busca').length; }

/* ---------- KPIs ---------- */
function kpis(){
  let venc = 0, sete = 0, crit = 0, aguard = 0, semSit = 0;
  for (const r of E.dados){
    const at = ativo(r), d = dias(r.prazo_resposta);
    if (at && d !== null && d < 0) venc++;
    if (at && d !== null && d >= 0 && d <= 7) sete++;
    if (at && r.prioridade === 'Crítica') crit++;
    if (r.situacao && ativo(r)) aguard++;
    if (!r.situacao) semSit++;
  }
  return { venc, sete, crit, aguard, semSit };
}
const KPI_DEF = [
  { k:'venc', cls:'k-venc', rot:'Prazo vencido', curto:'Vencidos', f:{ prazo:'vencido' } },
  { k:'sete', cls:'k-7', rot:'Vence em até 7 dias', curto:'Até 7 dias', f:{ prazo:'7dias' } },
  { k:'crit', cls:'k-crit', rot:'Críticos em aberto', curto:'Críticos', f:{ prioridade:'Crítica', situacao:'__ativos' } },
  { k:'aguard', cls:'k-aguard', rot:'Aguardando resposta', curto:'Aguardando', f:{ situacao:'__aguardando' } },
  { k:'semSit', cls:'k-sem', rot:'Sem situação definida', curto:'Sem situação', f:{ situacao:'__sem' } },
];
function kpiAtivo(d){ return Object.keys(E.f).every(k => k === 'busca' || (E.f[k] || '') === (d.f[k] || '')); }

/* ---------- casca ---------- */
function montarApp(){
  $('#raiz').innerHTML = `
  <div class="app" id="app">
    <header class="topo" id="topo"></header>
    <section class="kpis" id="kpis" aria-label="Indicadores"></section>
    <section class="filtros" id="filtros" aria-label="Filtros"></section>
    <main class="principal" id="principal"></main>
  </div>`;
  new ResizeObserver(() => { if (['lista', 'historico', 'painel'].includes(E.vista)) renderPrincipal(); else encaixarTudo(); }).observe($('#principal'));
}
function emInicio(){ return E.vista === 'lista' && !nFiltros() && !E.f.busca && !E.pagina; }
function renderTopo(){
  const t = $('#topo'); if (!t) return;
  const ed = podeEditar();
  const longe = !emInicio();
  const anima = longe && !E.inicioAvisado;
  E.inicioAvisado = longe;
  t.innerHTML = `
    <button class="bt bt-inicio ${longe ? 'longe' : ''} ${anima ? 'anima' : ''}" id="b-inicio" title="Voltar para a tela inicial" ${longe ? '' : 'aria-current="page"'}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Início</button>
    <img class="marca" src="assets/logo-confea-crea-branca.png" alt="Sistema Confea/Crea" width="139" height="24">
    <h1><span class="nome-longo">Controle de Processos</span><small>Gabinete da Presidência</small></h1>
    <button class="ajuda-bt" type="button" data-ajuda="pagina" aria-label="Ajuda sobre a página" title="Ajuda sobre a página">?</button><span class="espaco"></span>
    <span class="vivo ${E.vivo ? 'on' : ''}" title="${E.sinc ? 'Dados conferidos às ' + E.sinc.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) : ''}"><i></i><span class="tx">${E.vivo ? 'Ao vivo' : 'Reconectando'}</span></span>
    ${ed ? `<button class="bt" id="b-novo" title="Novo processo"><span class="tx">Novo processo</span><span class="ic">＋</span></button>` : ''}
    <button class="bt ${E.vista === 'painel' ? 'on' : ''}" id="b-painel" title="Painel: evolução e tempo de resolução"><span class="tx">Painel</span><span class="ic">▥</span></button>
    <button class="bt ${E.vista === 'historico' ? 'on' : ''}" id="b-hist" title="Histórico de ações"><span class="tx">Histórico</span><span class="ic">≡</span></button>
    <button class="bt ${E.vista === 'conta' ? 'on' : ''}" id="b-conta" title="Minha conta"><span class="tx">${esc(E.perfil.nome)}</span><span class="ic">${esc(E.perfil.nome.slice(0, 1))}</span></button>
    <span class="sinc ${E.sincronizando ? 'on' : ''}" aria-hidden="true"></span>`;
  $('#b-inicio').onclick = irInicio;
  $('#b-painel').onclick = () => irPara(E.vista === 'painel' ? 'lista' : 'painel');
  $('#b-hist').onclick = () => irPara(E.vista === 'historico' ? 'lista' : 'historico');
  $('#b-conta').onclick = () => irPara(E.vista === 'conta' ? 'lista' : 'conta');
  if (ed) $('#b-novo').onclick = () => { E.form = null; irPara('novo'); };
}
function irInicio(){
  if (E.sujo && !confirmarSaida()) return;
  E.f = { busca:'', situacao:'', prioridade:'', prazo:'', orgao:'', uf:'', tipo:'', ags:'' };
  E.ord = { campo:'urgencia', dir:1 }; E.pagina = 0; E.ajuda = null;
  const b = $('#f-busca'); if (b) b.value = '';
  irPara('lista');
}
function irPara(v, id){ fecharModal(); E.voltaModal = null; E.concluindo = null; E.aviso = null; E.soAssunto = false; E.vista = v; if (id !== undefined) E.selId = id; E.sujo = false; E.aba = 'dados'; E.formPag = 0; render(); }

function renderKpis(){
  const n = kpis();
  $('#kpis').innerHTML = KPI_DEF.map(d => `<div class="kpi-c">
    <button class="kpi ${d.cls} ${n[d.k] ? 'tem' : ''} ${kpiAtivo(d) ? 'ativo' : ''}" data-k="${d.k}" title="${esc(d.rot)}: mostrar estes processos">
      <b>${num(n[d.k])}</b><span><span class="longo">${esc(d.rot)}</span><span class="curto">${esc(d.curto)}</span></span>
    </button><button class="ajuda-bt" type="button" data-ajuda="kpis:${d.k}" aria-label="O que é ${esc(d.rot)}" title="O que é ${esc(d.rot)}">?</button></div>`).join('');
  E.kpiAntes = E.kpiAntes || {};
  $('#kpis').querySelectorAll('.kpi').forEach(b => {
    const k = b.dataset.k, el = b.querySelector('b'), novo = n[k], velho = E.kpiAntes[k];
    if (velho !== undefined && velho !== novo){
      el.classList.add('mudou');
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
        const t0 = performance.now(), dur = 600;
        const passo = t => { const f = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - f, 3); el.textContent = num(Math.round(velho + (novo - velho) * e)); if (f < 1) requestAnimationFrame(passo); };
        requestAnimationFrame(passo);
      }
    }
    E.kpiAntes[k] = novo;
  });
  $('#kpis').querySelectorAll('.kpi').forEach(b => b.onclick = () => {
    const d = KPI_DEF.find(x => x.k === b.dataset.k);
    const ja = kpiAtivo(d);
    E.f = { ...E.f, situacao:'', prioridade:'', prazo:'', orgao:'', uf:'', tipo:'', ags:'' };
    if (!ja) Object.assign(E.f, d.f);
    E.pagina = 0; E.vista = 'lista'; render();
  });
}

function opcoes(campo, ignorar){
  const c = new Map();
  for (const r of E.dados) if (passa(r, { ...E.f, [ignorar]:'' })) { const v = r[campo]; c.set(v ?? null, (c.get(v ?? null) || 0) + 1); }
  return c;
}
function selectHTML(id, rotuloVazio, itens, valor){
  return `<select class="campo" id="${id}" aria-label="${esc(rotuloVazio)}"><option value="">${esc(rotuloVazio)}</option>${itens.map(([v, t]) => `<option value="${esc(v)}" ${v === valor ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
}
function filtrosHTML(){
  const conta = (m, v) => m.get(v) || 0;
  const mSit = opcoes('situacao', 'situacao'), mPri = opcoes('prioridade', 'prioridade');

/* Mostra só os campos que cabem; os demais ficam nas páginas seguintes do formulário */
function encaixarForm(form, volta){
  const caixa = form.querySelector('.linhas'), campos = [...caixa.children];
  if (!campos.length) return;
  E.formPag = E.formPag || 0;
  const grupos = []; let atual = [];
  campos.forEach(c => c.hidden = true);
  for (const c of campos){
    c.hidden = false; atual.push(c);
    if (caixa.scrollHeight > caixa.clientHeight + 1 && atual.length > 1){
      c.hidden = true; atual.pop(); atual.forEach(x => x.hidden = true);
      grupos.push(atual); atual = [c]; c.hidden = false;
    }
  }
  grupos.push(atual);
  campos.forEach(c => c.hidden = true);
  if (E.formPag >= grupos.length) E.formPag = grupos.length - 1;
  grupos[E.formPag].forEach(c => c.hidden = false);
  const nav = form.querySelector('.paginas-form');
  if (nav){
    if (grupos.length > 1){
      nav.innerHTML = `<button type="button" class="bt" data-d="-1" ${E.formPag ? '' : 'disabled'} aria-label="Campos anteriores">‹</button> campos ${E.formPag + 1} de ${grupos.length} <button type="button" class="bt" data-d="1" ${E.formPag < grupos.length - 1 ? '' : 'disabled'} aria-label="Próximos campos">›</button>`;
      nav.querySelectorAll('button').forEach(b => b.onclick = () => { E.formPag += +b.dataset.d; encaixarForm(form); });
    } else nav.innerHTML = '';
  }
  const vis = campos.filter(c => !c.hidden);
  if (!volta && vis.length > 1 && caixa.scrollHeight > caixa.clientHeight + 1) encaixarForm(form, true);
}
/* Assunto longo em tela pequena: divide o texto em partes que cabem inteiras */
function paginarAssunto(){
  const el = $('#det-assunto'), box = el.parentElement, r = E.porId.get(E.selId);
  const palavras = (r.assunto || '').split(/\s+/);
  const partes = []; let i = 0;
  el.style.fontSize = '13px';
  while (i < palavras.length){
    let lo = 1, hi = palavras.length - i;
    while (lo < hi){ const m = Math.ceil((lo + hi) / 2); el.textContent = palavras.slice(i, i + m).join(' ') + ' (continua)'; if (box.scrollHeight <= box.clientHeight + 1) lo = m; else hi = m - 1; }
    partes.push(palavras.slice(i, i + lo).join(' ')); i += lo;
  }
  E.assPag = Math.min(E.assPag || 0, partes.length - 1);
  el.textContent = partes[E.assPag] + (E.assPag < partes.length - 1 ? ' (continua)' : '');
  const nav = $('#d-asspag');
  nav.innerHTML = partes.length > 1 ? `<button type="button" class="bt" data-d="-1" ${E.assPag ? '' : 'disabled'}>‹</button> ${E.assPag + 1} de ${partes.length} <button type="button" class="bt" data-d="1" ${E.assPag < partes.length - 1 ? '' : 'disabled'}>›</button>` : '';
  nav.querySelectorAll('button').forEach(b => b.onclick = () => { E.assPag += +b.dataset.d; paginarAssunto(); });
}
function caberTexto(el, min = 11, max = 14){
  if (!el) return true;
  let t = max; el.style.fontSize = t + 'px';
  const box = el.parentElement;
  while (box.scrollHeight > box.clientHeight + 1 && t > min){ t -= 0.5; el.style.fontSize = t + 'px'; }
  return box.scrollHeight <= box.clientHeight + 1;
}

    const atraso = v.prazo_resposta ? difDias(v.prazo_resposta, v.data_conclusao) : null;
    const pz = atraso === null ? 'sem prazo informado' : atraso <= 0 ? 'dentro do prazo' : `${atraso} dia${atraso === 1 ? '' : 's'} depois do prazo`;

  };

  const dz = $('#d-desfazer'); if (dz) dz.onclick = () => { E.sujo = false; E.edit = null; E.concluindo = null; renderDetalhe(p); };
  $('#d-ler').onclick = () => { E.soAssunto = !E.soAssunto; E.assPag = 0; renderDetalhe(p); };
  const cr = $('#d-corrigir'); if (cr) cr.onclick = () => { E.form = { ...r }; irPara('novo'); };
  const validar = () => {
    const hoje = hojeISO();
    if (v.data_recebimento && v.data_recebimento > hoje) return 'A data de recebimento não pode ser no futuro.';
    if (v.data_conclusao && v.data_conclusao > hoje) return 'A data de conclusão não pode ser no futuro.';
    if (v.data_conclusao && !v.data_recebimento) return 'Informe a data de recebimento antes da data de conclusão.';
    if (v.data_conclusao && v.data_conclusao < v.data_recebimento) return 'A data de conclusão não pode ser antes da data de recebimento.';
    if (v.data_recebimento && v.prazo_resposta && v.prazo_resposta < v.data_recebimento) return 'O prazo para resposta não pode ser antes da data de recebimento.';
    return null;

  /* Concluir: sem data de conclusão, propõe hoje e espera a confirmação; a data pode ser trocada */
  const pedirConclusao = () => {
    if (!v.data_recebimento){ avisar('Informe a data de recebimento antes de concluir.', 'erro'); const i = f.querySelector('[name=data_recebimento]'); if (!i.closest('label').hidden) i.focus(); return; }

  };

    const campos = ['situacao','prioridade','data_recebimento','prazo_resposta','data_conclusao','observacao'];

    const { data, error } = await sb.from('processos').update(mud).eq('id', r.id).eq('atualizado_em', r.atualizado_em).select(COLS);

    Object.assign(r, data[0]); delete r._b; E.sujo = false; E.edit = null; E.concluindo = null; renderDetalhe(p);
    avisar(mud.data_conclusao ? `Processo concluído em ${br(mud.data_conclusao)}.` : 'Salvo.', 'ok');
  };
  const bc = $('#d-concluir'); if (bc) bc.onclick = () => E.concluindo === r.id ? salvar() : pedirConclusao();
  const nc = $('#d-ncancelar'); if (nc) nc.onclick = () => { E.concluindo = null; v.data_conclusao = r.data_conclusao; if (v.situacao !== r.situacao && FINAIS.includes(v.situacao)) v.situacao = r.situacao; renderDetalhe(p); };
  f.onsubmit = e => {
    e.preventDefault(); if (!ed) return;
    if (E.concluindo === r.id) return salvar();
    // situação final escolhida sem data de conclusão: pede a data antes de salvar
    if (FINAIS.includes(v.situacao) && v.situacao !== r.situacao && !v.data_conclusao) return pedirConclusao();

}

/* ---------- painel: evolução e tempo de resolução ---------- */
const PN_PADRAO = () => ({ orgao:'', tipo:'', uf:'', escala:'mes', periodo:'tudo', aba:'evolucao', res:'orgao', pagE:null, pagR:0, pagP:0, filtros:false });
E.pn = PN_PADRAO();
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ESCALAS = { semana:'Semana', mes:'Mês', ano:'Ano' };
const COR_REC = '#00509b', COR_CON = '#ba9705';
const tempoRes = r => r.data_recebimento && r.data_conclusao ? difDias(r.data_recebimento, r.data_conclusao) : null;
const dec = n => n.toLocaleString('pt-BR', { minimumFractionDigits:1, maximumFractionDigits:1 });
const mediaDe = l => { const t = l.map(tempoRes).filter(x => x !== null); return t.length ? t.reduce((a, b) => a + b, 0) / t.length : null; };
const plural = (n, um, varios) => `${num(n)} ${n === 1 ? um : varios}`;
/* Chave do período: ano "2026", mês "2026-11", semana pela segunda-feira "2026-11-23" */
function chavePer(iso, es){
  if (es === 'ano') return iso.slice(0, 4);
  if (es === 'mes') return iso.slice(0, 7);
  const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); return d.toISOString().slice(0, 10);
}
function proxPer(k, es){
  if (es === 'ano') return String(+k + 1);
  if (es === 'mes'){ let [y, m] = k.split('-').map(Number); if (++m > 12){ m = 1; y++; } return `${y}-${String(m).padStart(2, '0')}`; }
  return addDias(k, 7);
}
function nomePer(k, es, longo){
  if (es === 'ano') return longo ? `${k}` : k;
  if (es === 'mes'){ const [y, m] = k.split('-'); return longo ? `${MESES_L[m - 1]} de ${y}` : `${MESES[m - 1]}/${y.slice(2)}`; }
  return longo ? `semana de ${br(k)} a ${br(addDias(k, 6))}` : `${k.slice(8, 10)}/${k.slice(5, 7)}`;
}
function faixaPeriodo(per){
  if (per === 'tudo') return [null, null];
  if (per === '12m' || per === '6m'){ let [y, m] = hojeISO().split('-').map(Number); m -= per === '12m' ? 11 : 5; while (m < 1){ m += 12; y--; } return [`${y}-${String(m).padStart(2, '0')}-01`, null]; }
  return [per + '-01-01', per + '-12-31'];
}
const nomePeriodo = per => ({ tudo:'todo o período', '12m':'últimos 12 meses', '6m':'últimos 6 meses' }[per] || 'ano de ' + per);
function pnDescFiltros(){
  const f = E.pn, sv = (v, t) => v === '__sem' ? t : v;
  return [f.orgao || 'todos os órgãos', f.tipo ? sv(f.tipo, 'sem tipo informado') : '', f.uf ? sv(f.uf, 'sem UF') : '', nomePeriodo(f.periodo)].filter(Boolean).join(' · ');
}
function pnDados(){
  const f = E.pn, [de, ate] = faixaPeriodo(f.periodo);
  const dentro = iso => iso && (!de || iso >= de) && (!ate || iso <= ate);
  const base = E.dados.filter(r => (!f.orgao || r.orgao_demandante === f.orgao)
    && (!f.tipo || (f.tipo === '__sem' ? !r.tipo_procedimento : r.tipo_procedimento === f.tipo))
    && (!f.uf || (f.uf === '__sem' ? !r.uf : r.uf === f.uf)));
  const rec = base.filter(r => dentro(r.data_recebimento));
  const con = base.filter(r => dentro(r.data_conclusao));
  const comT = con.filter(r => tempoRes(r) !== null).sort((a, b) => tempoRes(b) - tempoRes(a));
  const comPrazo = con.filter(r => r.prazo_resposta);
  const est = estatPrazos(base);
  return { de, ate, base, rec, con, comT, media: mediaDe(comT), comPrazo, est, foraRec: rec.filter(r => foraPadrao(r, est)),
    aberto: rec.filter(ativo), noPrazo: comPrazo.filter(r => r.data_conclusao <= r.prazo_resposta), semData: base.filter(r => !r.data_recebimento) };
}
/* Prazo dado pelo órgão: dias corridos do recebimento ao prazo */
const prazoDado = r => r.data_recebimento && r.prazo_resposta ? difDias(r.data_recebimento, r.prazo_resposta) : null;
const MIN_PADRAO = 5;
function quantil(ord, q){ const p = (ord.length - 1) * q, i = Math.floor(p); return ord[i] + (ord[Math.min(i + 1, ord.length - 1)] - ord[i]) * (p - i); }
/* Estatística dos prazos de cada órgão; faixa normal pela regra de Tukey: de Q1 - 1,5 x IQR a Q3 + 1,5 x IQR */
function estatPrazos(lista){
  const g = new Map(), res = new Map();
  lista.forEach(r => { if (prazoDado(r) === null) return; const k = r.orgao_demandante || 'Sem órgão'; (g.get(k) || g.set(k, []).get(k)).push(r); });
  for (const [nome, l] of g){
    const v = l.map(prazoDado).sort((a, b) => a - b), n = v.length, media = v.reduce((a, b) => a + b, 0) / n;
    const dp = n > 1 ? Math.sqrt(v.reduce((s, x) => s + (x - media) ** 2, 0) / (n - 1)) : 0;
    const q1 = quantil(v, .25), q3 = quantil(v, .75), iqr = q3 - q1, tem = n >= MIN_PADRAO;
    const lo = tem ? q1 - 1.5 * iqr : null, hi = tem ? q3 + 1.5 * iqr : null;
    const dentro = tem ? v.filter(x => x >= lo && x <= hi) : v;
    const fora = tem ? l.filter(r => { const p = prazoDado(r); return p < lo || p > hi; }) : [];
    res.set(nome, { nome, l, n, media, dp, mediana: quantil(v, .5), q1, q3, min: v[0], max: v[n - 1], lo, hi, nMin: dentro[0], nMax: dentro[dentro.length - 1], fora, tem });
  }
  return res;
}
const foraPadrao = (r, est) => { const e = est.get(r.orgao_demandante || 'Sem órgão'), p = prazoDado(r); return !!(e && e.tem && p !== null && (p < e.lo || p > e.hi)); };
/* Compara o prazo de um processo com os prazos que o mesmo órgão deu nos outros processos */

function escalaY(max){

}

    const faixa = e.tem ? `de ${num(e.nMin)} a ${num(e.nMax)} dias` : `sem faixa: menos de ${MIN_PADRAO} prazos`;
    b.onpointerenter = () => { const r = b.getBoundingClientRect(), o = el.getBoundingClientRect(); dica(el, `<b>${esc(e.nome)}</b><br>Processos com prazo: ${num(e.n)}<br>Média: ${dec(e.media)} dias · desvio padrão: ${dec(e.dp)}<br>Mediana: ${dec(e.mediana)} · menor: ${num(e.min)} · maior: ${num(e.max)}<br>Faixa normal: ${faixa}<br>Fora do padrão: ${num(e.fora.length)}`, r.left - o.left + r.width / 2, r.top - o.top); };
    b.onpointerleave = () => dica(el, null);
    const ordem = [...e.l].sort((a, b2) => (e.fora.includes(b2) - e.fora.includes(a)) || prazoDado(a) - prazoDado(b2));

  });
}

/* ---------- modal com os processos de uma seleção ---------- */
function abrirModal(m){ E.modal = { ...m, pag: 0 }; E.modalFoco = document.activeElement; renderModal(true); }
function fecharModal(){ const el = $('#modal'); if (el) el.remove(); const volta = E.modal && E.modalFoco; E.modal = null; if (volta && volta.isConnected) volta.focus(); }
function renderModal(primeira){
  const m = E.modal; if (!m) return;
  let el = $('#modal');
  if (!el){ el = document.createElement('div'); el.id = 'modal'; el.className = 'modal-fundo'; el.onclick = e => { if (e.target === el) fecharModal(); }; document.body.appendChild(el); }
  const lista = m.ids.map(id => E.porId.get(id)).filter(Boolean);
  el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="md-t">
    <div class="modal-topo"><div class="tt"><h2 id="md-t" title="${esc(m.titulo)}">${esc(m.titulo)}</h2><p title="${esc(m.sub)}">${esc(m.sub)}</p></div><button class="ajuda-bt" type="button" id="md-aj" aria-label="Ajuda: lista de processos" title="Como usar esta lista">?</button><button class="bt md-x" type="button" id="md-x" aria-label="Fechar" title="Fechar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="md-aj" id="md-ajtx" hidden>Estes são os processos da parte do painel que você clicou. Clique num processo para abrir. No processo, o botão ‹ Painel volta para esta lista.</p>
    <ul class="itens" id="md-l"></ul><div class="pager" id="md-p"></div></div>`;
  $('#md-aj').onclick = e => { e.stopPropagation(); $('#md-ajtx').hidden = !$('#md-ajtx').hidden; m.ajuda = !$('#md-ajtx').hidden; renderLista(); };
  if (m.ajuda) $('#md-ajtx').hidden = false;
  function renderLista(){
    const estreito = window.innerWidth <= 520;
    const ul = $('#md-l'), per = Math.max(1, Math.floor(ul.clientHeight / 56)), n = Math.max(1, Math.ceil(lista.length / per));
    if (m.pag >= n) m.pag = n - 1;
    const ini = m.pag * per;
    const linha = r => { const t = tempoRes(r), pz = prazoDado(r);
      if (m.modo === 'prazo') return [r.processo_orgao ? '' : r.orgao_demandante, pz !== null ? `prazo de ${pz} dia${pz === 1 ? '' : 's'} (${br(r.data_recebimento)} a ${br(r.prazo_resposta)})` : 'sem prazo', (m.fora || []).includes(r.id) ? 'fora do padrão' : ''].filter(Boolean).join(' · ');
      return [r.processo_orgao ? '' : r.orgao_demandante, r.data_recebimento ? 'recebido ' + br(r.data_recebimento) : 'sem data de recebimento', r.data_conclusao ? `concluído ${br(r.data_conclusao)}${t !== null ? ` (${t} dia${t === 1 ? '' : 's'})` : ''}` : `em aberto${estreito ? ', ' + prazoInfo(r).tx.toLowerCase() : ''}`].filter(Boolean).join(' · '); };
    ul.innerHTML = lista.length ? lista.slice(ini, ini + per).map(r => `<li class="item" data-id="${r.id}" role="button" tabindex="0"><div class="txt"><div class="t1">${esc(rotulo(r))}</div><div class="t2">${esc(linha(r))}</div></div>${seloPrazo(r)}</li>`).join('') : '<li class="mais">Nenhum processo nesta seleção.</li>';
    $('#md-p').innerHTML = `<span>${num(lista.length ? ini + 1 : 0)} a ${num(Math.min(ini + per, lista.length))} de ${plural(lista.length, 'processo', 'processos')}</span><span class="bts"><button class="bt" type="button" data-d="-1" ${m.pag ? '' : 'disabled'} aria-label="Página anterior">‹</button><button class="bt" type="button" data-d="1" ${m.pag < n - 1 ? '' : 'disabled'} aria-label="Próxima página">›</button></span>`;
    $('#md-p').querySelectorAll('button').forEach(b => b.onclick = () => { m.pag += +b.dataset.d; renderLista(); });
    ul.querySelectorAll('.item').forEach(li => { li.onclick = () => abrirDoPainel(+li.dataset.id); li.onkeydown = e => { if (e.key === 'Enter') li.click(); }; });
  }
  renderLista();
  $('#md-x').onclick = fecharModal;
  if (primeira) $('#md-x').focus();
}
function abrirDoPainel(id){ const m = E.modal; irPara('detalhe', id); E.voltaModal = m; renderPrincipal(); }

function abrirAjuda(chave){
  const [topico, item] = chave.split(':');
  const volta = E.vista === 'ajuda' && E.ajuda ? E.ajuda.volta : { vista: E.vista, aba: E.aba };

  const mpf = E.dados.find(r => r.orgao_demandante === 'MPF' && r.processo_orgao) || tcuDen;
  const cont = {}; E.dados.forEach(r => { if (r.relator) cont[r.relator] = (cont[r.relator] || 0) + 1; });
  const relator = Object.entries(cont).sort((a, b) => b[1] - a[1])[0] || ['o nome do relator', 0];
  const ini = '2026-11-13';
  const n = kpis();
  return { hoje, tcuDen: tcuDen.processo_orgao ? rotulo(tcuDen) : 'TCU 000.000/2026-0', mpf: mpf.processo_orgao ? rotulo(mpf) : 'MPF 1.00.000.000000/2026-00',

      { id:'tempo', t:'Tempo médio por órgão e por tipo', d:'Cada linha mostra a média de dias corridos para concluir os processos daquele órgão ou tipo, e quantos processos entraram na conta. A linha mais longa demora mais. Use Órgão e Tipo no alto do quadro para trocar.', ex:'TCU com 20,5 dias e 4 proc.: os 4 processos concluídos do TCU levaram, em média, 20,5 dias.' },
      { id:'semdata', t:'Processos fora do painel', d:'Processo sem data de recebimento não entra nos gráficos. O aviso embaixo dos números mostra quantos são. Clique nele para ver a lista e informar as datas.', ex:`Hoje ${B(num(E.dados.filter(r => !r.data_recebimento).length))} processos estão sem data de recebimento.` },
      { id:'modal', t:'Lista de processos', d:'Mostra os processos da parte que você clicou. Clique num processo para abrir. No processo, o botão ‹ Painel volta para a lista. Feche no botão Fechar, no canto de cima, com a tecla Esc ou clicando fora.', ex:'Clique na linha do TCU, abra um processo, confira e clique em ‹ Painel para voltar.' },
    ]},
    conta: { titulo:'Minha conta', intro:'Aqui ficam o seu usuário, o seu perfil, a troca de senha, a planilha e a saída.', itens:[
      { id:'senha', t:'Trocar a senha', d:'Digite a nova senha duas vezes, com pelo menos 10 caracteres, e clique em Trocar senha. A troca entra no histórico.', ex:'Nova senha: Gabinete-Prazo-2026 (use uma só sua).' },
      { id:'csv', t:'Baixar planilha', d:'Baixa a lista com os filtros que estão ligados, em CSV, para abrir no Excel.', ex:'Filtre Prazo vencido e baixe a planilha para levar à reunião.' },
      { id:'sair', t:'Sair', d:'Encerra a sessão neste aparelho. Use em computador compartilhado.', ex:'Terminou o dia num computador da sala de reunião: clique em Sair.' },
    ]},
  };
}
function renderAjuda(p){
  const T = topicosAjuda(), a = E.ajuda || { topico:'pagina' };
  const tp = T[a.topico] || T.pagina;
  p.innerHTML = `<div class="vista">
    <div class="vista-topo aj-topo"><button class="bt" id="aj-voltar">‹ Voltar</button>
      <select class="campo" id="aj-topico" aria-label="Assunto da ajuda">${Object.entries(T).map(([k, v]) => `<option value="${k}" ${k === a.topico ? 'selected' : ''}>Ajuda: ${esc(v.titulo)}</option>`).join('')}</select></div>
    <div class="vista-corpo"><div class="aj-itens" id="aj-itens"><p class="aj-intro" data-id="__intro">${tp.intro}</p>${tp.itens.map(i => `<section class="aj-item ${i.id === a.item ? 'alvo' : ''}" data-id="${i.id}"><h4>${esc(i.t)}</h4><p>${i.d}</p><p class="aj-ex"><b>Exemplo:</b> ${i.ex}</p></section>`).join('')}</div></div>
    <div class="pager" id="aj-pager"></div></div>`;
  $('#aj-voltar').onclick = fecharAjuda;
  $('#aj-topico').onchange = e => { E.ajuda = { ...a, topico: e.target.value, item: null, pag: 0 }; renderAjuda(p); };
  E.repaginarAjuda = () => paginarAjuda(p);
  encaixarDepois(); setTimeout(() => { if (E.vista === 'ajuda') paginarAjuda(); }, 450);
}
function paginarAjuda(){
  const caixa = $('#aj-itens'); if (!caixa) return;
  const itens = [...caixa.children], a = E.ajuda;
  const grupos = []; let atual = [];
  itens.forEach(i => { i.hidden = true; i.style.fontSize = ''; i.querySelectorAll('p,h4').forEach(x => x.style.fontSize = ''); });
  for (const it of itens){
    it.hidden = false; atual.push(it);
    if (caixa.scrollHeight > caixa.clientHeight + 1 && atual.length > 1){ it.hidden = true; atual.pop(); atual.forEach(x => x.hidden = true); grupos.push(atual); atual = [it]; it.hidden = false; }
  }
  grupos.push(atual);
  itens.forEach(i => i.hidden = true);
  if (a.pag == null) a.pag = Math.max(0, grupos.findIndex(g => g.some(i => i.dataset.id === a.item)));
  if (a.pag >= grupos.length) a.pag = grupos.length - 1;
  grupos[a.pag].forEach(i => i.hidden = false);
  /* item sozinho e maior que a área: reduz a letra até caber */
  if (grupos[a.pag].length === 1){ const it = grupos[a.pag][0]; let t = 13.5; while (caixa.scrollHeight > caixa.clientHeight + 1 && t > 10){ t -= .5; it.style.fontSize = t + 'px'; it.querySelectorAll('p,h4').forEach(x => x.style.fontSize = t + 'px'); } }
  const pg = $('#aj-pager');
  pg.innerHTML = `<span>${grupos.length > 1 ? `Parte ${a.pag + 1} de ${grupos.length}` : 'Tudo nesta tela'}</span><span class="bts"><button class="bt" data-d="-1" ${a.pag ? '' : 'disabled'} aria-label="Parte anterior">‹</button><button class="bt" data-d="1" ${a.pag < grupos.length - 1 ? '' : 'disabled'} aria-label="Próxima parte">›</button></span>`;
  pg.querySelectorAll('button').forEach(b => b.onclick = () => { a.pag += +b.dataset.d; a.item = null; paginarAjuda(); });
  if (a.item) setTimeout(() => { const al = caixa.querySelector('.aj-item.alvo'); if (al) al.classList.remove('alvo'); }, 2200);
}

/* ---------- conta ---------- */
function renderConta(p){
  const papel = { admin:'Administração (consulta, edição e exclusão)', editor:'Edição (consulta e edição)', leitor:'Consulta' }[E.perfil.papel];
  p.innerHTML = `<div class="vista">
    <div class="vista-topo"><button class="bt" id="c-voltar">‹ Lista</button><h2>Minha conta</h2><button class="ajuda-bt" type="button" data-ajuda="conta" aria-label="Ajuda: minha conta">?</button><button class="bt" id="c-sair">Sair</button></div>
    <div class="vista-corpo"><form class="form" id="f-senha" style="max-width:520px">
      <dl class="dl"><div><dt>Nome</dt><dd>${esc(E.perfil.nome)}</dd></div><div><dt>Usuário</dt><dd>${esc(E.perfil.usuario)}</dd></div><div style="grid-column:1/-1"><dt>Perfil</dt><dd>${esc(papel)}</dd></div></dl>
      <div class="linhas">
        <label>Nova senha<input class="campo" type="password" name="s1" minlength="10" autocomplete="new-password" required></label>
        <label>Repita a nova senha<input class="campo" type="password" name="s2" minlength="10" autocomplete="new-password" required></label>
      </div>
      <div class="acoes"><button class="bt esc" type="submit">Trocar senha</button><button class="bt" type="button" id="c-csv">Baixar planilha (CSV)</button><span class="msg" id="c-msg"></span></div>
    </form></div></div>`;
  $('#c-voltar').onclick = () => irPara('lista');
  $('#c-sair').onclick = sair;
  $('#c-csv').onclick = baixarCSV;
  $('#f-senha').onsubmit = async e => {
    e.preventDefault();
    const s1 = e.target.s1.value, s2 = e.target.s2.value;
    if (s1.length < 10) return avisar('A senha precisa ter pelo menos 10 caracteres.', 'erro');
    if (s1 !== s2) return avisar('As duas senhas estão diferentes.', 'erro');
    const { error } = await sb.auth.updateUser({ password: s1 });
    if (error) return avisar('Não trocou: ' + error.message, 'erro');
    await sb.rpc('registrar_acesso', { p_acao:'trocou a senha' });
    e.target.reset(); avisar('Senha trocada.', 'ok');
  };
}
function baixarCSV(){
  const cab = ['Processo SEI','Processo do órgão de controle','Órgão demandante','UF','Localidade','Assunto da demanda','Situação histórica (AGS)','Autoridade / Relator','Tipo de procedimento','Situação do processo','Prioridade','Data de recebimento','Prazo para resposta','Data de conclusão','Situação do prazo','Observação'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const linhas = filtrados().map(r => [r.processo_sei, r.processo_orgao, r.orgao_demandante, r.uf, r.localidade, r.assunto, r.situacao_ags, r.relator, r.tipo_procedimento, r.situacao, r.prioridade, br(r.data_recebimento), br(r.prazo_resposta), br(r.data_conclusao), prazoInfo(r).tx, r.observacao].map(q).join(';'));
  const blob = new Blob(['﻿' + [cab.map(q).join(';'), ...linhas].join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `processos-gabinete-${hojeISO()}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- sessão ---------- */
async function sair(){
  try { await sb.rpc('registrar_acesso', { p_acao:'saiu' }); } catch(e){}
  if (E.canal) sb.removeChannel(E.canal);
  await sb.auth.signOut();
  E.perfil = null; telaLogin();
}
function telaLogin(msg){
  $('#raiz').innerHTML = $('#t-login').innerHTML;
  if (msg) $('#login-msg').textContent = msg;
  $('#login-aj').onclick = () => { const t = $('#login-ajtx'); t.hidden = !t.hidden; };
  $('#f-login').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, b = f.querySelector('button');
    let u = f.usuario.value.trim().toLowerCase();
    const email = u.includes('@') ? u : `${u}@${DOMINIO}`;
    b.disabled = true; $('#login-msg').textContent = 'Entrando...';
    const { error } = await sb.auth.signInWithPassword({ email, password: f.senha.value });
    b.disabled = false;
    if (error){ $('#login-msg').textContent = 'Usuário ou senha incorretos.'; return; }
    iniciar(true);
  };
}
async function iniciar(login){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  const { data: perf, error } = await sb.rpc('meu_perfil');
  if (error || !perf || !perf.length){ await sb.auth.signOut(); return telaLogin('Este usuário não tem acesso a este sistema.'); }
  E.perfil = perf[0];
  montarApp();
  $('#principal').innerHTML = `<div class="esqueleto" role="status"><span>Carregando processos...</span>${'<i></i>'.repeat(12)}</div>`;
  $('#app').classList.add('entrada'); setTimeout(() => { const a = $('#app'); if (a) a.classList.remove('entrada'); }, 1400);
  renderTopo();
  try { await Promise.all([carregar(), carregarEventos()]); }
  catch(err){ $('#principal').innerHTML = `<div class="carregando">Não foi possível carregar os dados (${esc(err.message)}). Recarregue a página.</div>`; return; }
  if (login || !sessionStorage.getItem('sispad-entrou')){ sessionStorage.setItem('sispad-entrou', '1'); sb.rpc('registrar_acesso', { p_acao:'entrou' }).then(() => {}); }
  render(); assinar();
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && E.perfil){ E.perfil = null; telaLogin('Sua sessão terminou. Entre de novo.'); } });
window.addEventListener('beforeunload', e => { if (E.sujo){ e.preventDefault(); e.returnValue = ''; } });
iniciar(false);
</script>
